/* Theme: the saved choice (localStorage 'yarnlog.theme'), dark by default. */
(function(){
  window.applyTheme=function(t){
    document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;
    var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='light'?'#f6efe6':'#1e1823';
    var c=document.querySelector('meta[name=color-scheme]');if(c)c.content=t;
  };
  var t='dark';try{var s=localStorage.getItem('yarnlog.theme');if(s==='light'||s==='dark')t=s}catch(e){}
  window.applyTheme(t);
})();

<style>
:root{--bg:#f6efe6;--panel:#fffaf3;--ink:#2e2433;--mute:#7b6f80;--line:#e4d6c5;--acc:#6b3fa0;--acc2:#e0577d;--ok:#3f8f6b;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1823;--panel:#2a2230;--ink:#f1e8f5;--mute:#a597ab;--line:#41364a;--acc:#b58cf0;--acc2:#ff8aa8;--ok:#6fcf9f;--accink:#1e1823}}
:root[data-theme="dark"]{--bg:#1e1823;--panel:#2a2230;--ink:#f1e8f5;--mute:#a597ab;--line:#41364a;--acc:#b58cf0;--acc2:#ff8aa8;--ok:#6fcf9f;--accink:#1e1823}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px}
h1,h2,.serif{font-family:Fraunces,Georgia,serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
button.dng{color:var(--acc2)}
button.ghost{border:none;background:none;padding:4px 8px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.app{display:flex;height:100%;overflow:hidden}
.app>aside{width:290px;flex:none;transition:margin-left .28s ease,transform .28s ease}
.app.nav-closed>aside{margin-left:-290px;visibility:hidden;transition:margin-left .28s ease,visibility 0s .28s}
.app>main{flex:1}
.navclose{margin-left:auto;font-size:26px;line-height:1;color:var(--mute);padding:2px 10px}
.navopen{display:none;position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:15;width:22px;height:60px;padding:0;border-left:none;border-radius:0 14px 14px 0;background:var(--panel);color:var(--acc);font-size:20px;line-height:1;opacity:.85}
.app.nav-closed .navopen{display:block}
img,.ball{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.th,.img img,aside h1 img{pointer-events:none}
.cele .ball svg{display:block;margin:0 auto}
.themes{display:inline-flex;gap:2px}
.themes button{width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid transparent;background:none;color:var(--mute)}
.themes button[aria-pressed=true]{background:var(--bg);color:var(--acc);border-color:var(--line)}
.hint-m{display:none}
.upd{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 24px);padding:8px 8px 8px 16px;background:var(--panel);color:var(--ink);border:1px solid var(--acc);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:updin .3s ease}
.upd span{font-weight:700}
@keyframes updin{from{transform:translate(-50%,-20px);opacity:0}}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden}
aside h1{margin:0;font-size:24px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools button{font-size:13px;padding:4px 10px}
.plist{display:flex;flex-direction:column;gap:2px;margin:6px 0;flex:1;min-height:0;overflow-y:auto}
.prow{display:flex;align-items:center;border-radius:8px}
.prow.sel{background:var(--bg)}
.prow .name{flex:1;text-align:left;border:none;background:none;padding:8px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{width:28px;padding:4px;border:none;background:none;color:var(--acc);transition:transform .2s}
.chev.open{transform:rotate(180deg)}
.chev.none{visibility:hidden}
.bld{margin:0 0 6px 28px;padding:8px;border-left:3px solid var(--acc);background:var(--bg);border-radius:0 8px 8px 0;font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;margin:6px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.bld .btns{display:flex;gap:6px}
.bld button{font-size:13px;padding:3px 9px}
.tools,.search,#warn,aside h1{flex:none}
main{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.mh{flex:none;padding:24px max(24px,calc(100% - 836px)) 12px 24px}
.mb{flex:1;min-height:0;overflow-y:auto;padding:0 max(24px,calc(100% - 836px)) 24px 24px}
.pt{position:sticky;top:0;z-index:2;background:var(--bg);margin:0 0 8px;padding:8px 0}
.empty{margin-top:15vh;text-align:center;color:var(--mute)}
.head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.title{flex:1;min-width:200px;font-family:Fraunces,serif;font-size:28px;font-weight:700;width:100%}
.img{position:relative;width:92px;height:92px;border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid var(--line)}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.img span{position:absolute;left:0;right:0;bottom:0;padding:3px;text-align:center;font-size:12px;color:#fff;background:rgba(30,24,35,.55)}
.th{width:36px;height:36px;border-radius:9px;object-fit:cover;flex:none;margin-left:2px}
.search{width:100%}
.hint{font-size:12px;color:var(--mute)}
.round.hit{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
input[type=number]{font-weight:800}
.prev b{font-weight:800;color:var(--acc)}
.meta .chk{font-size:13px}
.step{border-left:5px solid var(--acc2)}
.step .top b{flex:1}
.ins{display:flex;gap:4px;justify-content:center;margin:0 0 8px;opacity:.55}
.ins:hover,.ins:focus-within{opacity:1}
.ins button{font-size:12px;padding:2px 8px;border-style:dashed}
.sw{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);vertical-align:middle;margin-right:6px}
input[type=color]{padding:0;width:44px;height:36px;cursor:pointer}
textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;color:inherit;resize:vertical}
.prev.sp{font-family:Nunito,system-ui,sans-serif;font-size:15px;white-space:pre-wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.round{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.round .top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.lbl{width:64px;font-weight:700}
.it{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.it input[type=number]{width:64px}
.it .sk{font-size:13px;color:var(--mute);display:flex;gap:4px;align-items:center;white-space:nowrap}
.it.skip input[type=number],.it.skip select{opacity:.5}
.ld{display:contents}
.stn{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--line);color:var(--mute);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.rb{font-size:12px;font-weight:700;color:var(--acc);border:1px solid var(--acc);border-radius:10px;padding:0 6px;white-space:nowrap}
.it.inrep,.grp.inrep{border-left:3px solid var(--acc);padding-left:8px}
.reps{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.rp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rp input[type=number]{width:64px}
.grp{border-left:3px solid var(--acc2);padding-left:10px;margin:8px 0}
.grp small{color:var(--mute)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.meta label{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
.meta input.note{flex:1;min-width:160px}
.prev{margin-top:10px;padding:8px 10px;background:var(--bg);border-radius:8px;font-family:ui-monospace,Menlo,monospace;font-size:14px;word-break:break-word}
.trk{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.trk input{width:22px;height:22px;margin-top:2px;accent-color:var(--ok)}
.trk.done{opacity:.55}
.info{display:flex;gap:10px;align-items:flex-start;margin:0 0 8px 14px;padding:4px 10px;border-left:3px solid var(--acc2);color:var(--mute)}
.info .star{font-weight:800;color:var(--acc2);font-size:20px;line-height:1.1}
.info .prev{background:none;padding:0;flex:1;color:var(--mute);font-size:14px;line-height:1.4}
.info .prev b{color:var(--mute);font-weight:700}
.info .sw{width:12px;height:12px;border-width:1px;margin-right:4px}
.trk.done .prev{text-decoration:line-through}
.trk .prev{margin:0;flex:1}
.bar-lg{height:10px}
.warn{color:var(--acc2);font-size:13px}
.round{content-visibility:auto;contain-intrinsic-size:auto 280px}
button:disabled{opacity:.35;cursor:default}
/* tabs */
.pth{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pth h2{margin:0}
.sub{font-size:13px;color:var(--mute);padding:3px 8px;border-color:transparent;background:none}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 4px;max-height:118px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.abbr{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 18px;margin:12px 0 0}
.abbr div{display:flex;gap:12px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--line)}
.abbr b{flex:none;min-width:58px;font-family:ui-monospace,Menlo,monospace;color:var(--acc)}
.abbr span{color:var(--ink)}
.tab{flex:0 1 auto;max-width:100%;min-width:0;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 13px;font-size:14px;white-space:nowrap}
.tab.on{background:var(--acc);border-color:var(--acc);color:var(--accink);font-weight:700}
.tab.add{border-style:dashed;color:var(--mute)}
.tab.hit::after{content:'\2022';color:var(--acc2);font-weight:800}
.tab small{opacity:.75;flex:none}
.tab.fin:not(.on){border-color:var(--ok);color:var(--ok)}
.tin{background:none;border:none;padding:0;min-width:4ch;max-width:min(60vw,24ch);text-overflow:ellipsis;font:inherit;font-weight:700;color:inherit;border-radius:4px}
.lblw{display:inline-flex;align-items:center;gap:2px;font-size:16px}
.lblw .lbl{width:56px}
.tot{display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
.tabtools{display:flex;gap:2px;justify-content:flex-end;margin:0 0 8px}
.tabtools button{font-size:12px;color:var(--mute);padding:2px 8px}
.bld .chips{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 6px}
.bld .chips button{font-size:12px;padding:2px 8px;border-radius:999px}
/* drag to reorder */
.grab{touch-action:none;cursor:grab;border:none;background:none;padding:4px 2px;color:var(--mute);font-size:16px;line-height:1;letter-spacing:-3px;min-width:26px;min-height:32px;flex:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.grab:hover{color:var(--acc)}
.drag{position:relative;z-index:5;background:var(--panel);box-shadow:0 8px 22px rgba(0,0,0,.45);border-radius:10px;cursor:grabbing}
.dropb{box-shadow:0 -3px 0 var(--acc)}
.dropa{box-shadow:0 3px 0 var(--acc)}
body.dragging,body.dragging *{user-select:none;-webkit-user-select:none;cursor:grabbing}
/* color picker */
.sbtn{width:44px;height:36px;border-radius:8px;border:2px solid var(--line);padding:0;flex:none}
.cpan{margin-top:10px;padding:10px;background:var(--bg);border-radius:10px;display:flex;flex-direction:column;gap:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatch{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);padding:0}
.rgb{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.rgb label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:2px}
.rgb input[type=number]{width:68px}
.rgb input.hex{width:96px;font-family:ui-monospace,Menlo,monospace}
/* dialogs + celebration */
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:min(360px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog p{margin:0 0 14px}
.cele{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(20,14,26,.6);animation:cfade .25s}
.cele .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px 26px;text-align:center;max-width:min(340px,calc(100vw - 32px));animation:cpop .55s cubic-bezier(.2,1.4,.4,1)}
.cele .ball{font-size:64px;line-height:1.1;animation:cbounce 1.3s ease-in-out infinite}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:70}
.glow{animation:cglow 1.6s ease-in-out infinite}
@keyframes cpop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes cfade{from{opacity:0}}
@keyframes cbounce{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-10px) rotate(8deg)}}
@keyframes cglow{0%,100%{box-shadow:0 0 0 0 rgba(181,140,240,0)}50%{box-shadow:0 0 0 6px rgba(181,140,240,.4)}}
@media (prefers-reduced-motion:reduce){.cele .ball,.cele .card,.glow{animation:none}}
.trk{content-visibility:auto;contain-intrinsic-size:auto 56px}
@media (max-width:760px){.app{position:relative}.app>aside{position:absolute;inset:0;width:100%;z-index:20;border-right:none}.app.nav-closed>aside{margin-left:0;transform:translateX(-100%);transition:transform .28s ease,visibility 0s .28s}.navclose,.navopen{display:none!important}.hint-d{display:none}.hint-m{display:block}main{padding:0}.mh{padding:16px 16px 10px}.mb{padding:0 16px 16px}}
</style>
</head>

<script>
const KEY='yarnlog.v1';
// the 3rd entry is an extra search alias. The key 'ml' is kept so saved projects keep working.
const T={ml:['Magic ring','mr','magic loop ml'],ch:['Chain','ch'],sc:['Single stitch','sc'],hdc:['Half double','hdc'],dc:['Double stitch','dc'],tc:['Triple stitch','tc'],sl:['Slip stitch','sl'],

/* ---------- theme buttons ---------- */
const curTheme=()=>document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';
function syncTheme(){document.querySelectorAll('[data-act=theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===curTheme())))}
function setTheme(t){try{localStorage.setItem('yarnlog.theme',t)}catch(e){}applyTheme(t);syncTheme()}
syncTheme();
/* ---------- explorer open/close + swipe ---------- */
const APP=document.querySelector('.app'),isMobile=()=>matchMedia('(max-width:760px)').matches;
const setNav=open=>APP.classList.toggle('nav-closed',!open);
let TS=null;
document.addEventListener('touchstart',e=>{
  const el=e.target;
  if(e.touches.length!==1||(el.closest&&el.closest('input,textarea,select,.grab,dialog,.cele'))){TS=null;return}
  TS={x:e.touches[0].clientX,y:e.touches[0].clientY,aside:!!(el.closest&&el.closest('aside'))}},{passive:true});
document.addEventListener('touchend',e=>{
  if(!TS)return;const t=e.changedTouches[0],dx=t.clientX-TS.x,dy=t.clientY-TS.y,from=TS;TS=null;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*2)return;
  const closed=APP.classList.contains('nav-closed');
  if(dx<0&&!closed&&from.aside)setNav(false);else if(dx>0&&closed)setNav(true)},{passive:true});
document.addEventListener('dragstart',e=>{if(e.target.tagName==='IMG')e.preventDefault()});
document.addEventListener('selectstart',e=>{if(e.target.tagName==='IMG')e.preventDefault()});

load();render();
</script>
<script>
/* Offline support + "update available" bar */
if('serviceWorker' in navigator){
  var accepted=false,reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!accepted||reloading)return;reloading=true;location.reload();   // only after the user tapped Update
  });
  var showUpdate=function(reg){
    if(document.querySelector('.upd'))return;
    var bar=document.createElement('div');bar.className='upd';bar.setAttribute('role','status');
    bar.innerHTML='<span>A new version is available</span><button class="pri" type="button">Update</button><button class="ghost" type="button" aria-label="Later" title="Later">&times;</button>';
    var b=bar.querySelectorAll('button');
    b[0].onclick=function(){
      accepted=true;b[0].disabled=true;b[0].textContent='Updating...';
      try{if(typeof writeNow==='function'&&saveT)writeNow()}catch(e){}   // flush unsaved edits first
      if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});else location.reload();
    };
    b[1].onclick=function(){bar.remove()};
    document.body.appendChild(bar);
  };
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(reg){
      if(reg.waiting&&navigator.serviceWorker.controller)showUpdate(reg);
      reg.addEventListener('updatefound',function(){
        var nw=reg.installing;if(!nw)return;
        nw.addEventListener('statechange',function(){
          if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdate(reg);
        });
      });
      var check=function(){if(navigator.onLine)reg.update().catch(function(){})};
      document.addEventListener('visibilitychange',function(){if(!document.hidden)check()});
      setInterval(check,60*60*1000);
    }).catch(function(){});
  });
}
</script>
