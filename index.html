<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23b58cf0%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23e0577d%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22url%28%23g%29%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2218%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.5%22/%3E%3Cpath%20d%3D%22M18%2026c10%206%2018%206%2028%200M16%2034c11%207%2021%207%2032%200M21%2043c8%204%2014%204%2022%200M27%2016c-4%2010-4%2021%202%2031M38%2015c4%209%204%2021-1%2032%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20opacity%3D%22.85%22/%3E%3Cpath%20d%3D%22M46%2046c5%203%207%207%2012%207%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">
<title>Yarn Log – Crochet projects</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe6;--panel:#fffaf3;--ink:#2e2433;--mute:#7b6f80;--line:#e4d6c5;--acc:#6b3fa0;--acc2:#e0577d;--ok:#3f8f6b;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1823;--panel:#2a2230;--ink:#f1e8f5;--mute:#a597ab;--line:#41364a;--acc:#b58cf0;--acc2:#ff8aa8;--ok:#6fcf9f;--accink:#1e1823}}
:root[data-theme="dark"]{--bg:#1e1823;--panel:#2a2230;--ink:#f1e8f5;--mute:#a597ab;--line:#41364a;--acc:#b58cf0;--acc2:#ff8aa8;--ok:#6fcf9f;--accink:#1e1823}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px}
h1,h2,.serif{font-family:Fraunces,Georgia,serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
button.dng{color:var(--acc2)}
button.ghost{border:none;background:none;padding:4px 8px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden}
aside h1{margin:0;font-size:24px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools button{font-size:13px;padding:4px 10px}
.plist{display:flex;flex-direction:column;gap:2px;margin:6px 0;flex:1;min-height:0;overflow-y:auto}
.prow{display:flex;align-items:center;border-radius:8px}
.prow.sel{background:var(--bg)}
.prow .name{flex:1;text-align:left;border:none;background:none;padding:8px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{width:28px;padding:4px;border:none;background:none;color:var(--acc);transition:transform .2s}
.chev.open{transform:rotate(180deg)}
.chev.none{visibility:hidden}
.bld{margin:0 0 6px 28px;padding:8px;border-left:3px solid var(--acc);background:var(--bg);border-radius:0 8px 8px 0;font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;margin:6px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.bld .btns{display:flex;gap:6px}
.bld button{font-size:13px;padding:3px 9px}
.tools,.search,#warn,aside h1{flex:none}
main{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.mh{flex:none;padding:24px max(24px,calc(100% - 836px)) 12px 24px}
.mb{flex:1;min-height:0;overflow-y:auto;padding:0 max(24px,calc(100% - 836px)) 24px 24px}
.pt{position:sticky;top:0;z-index:2;background:var(--bg);margin:0 0 8px;padding:8px 0}
.empty{margin-top:15vh;text-align:center;color:var(--mute)}
.head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.title{flex:1;min-width:200px;font-family:Fraunces,serif;font-size:28px;font-weight:700;width:100%}
.img{position:relative;width:92px;height:92px;border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid var(--line)}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.img span{position:absolute;left:0;right:0;bottom:0;padding:3px;text-align:center;font-size:12px;color:#fff;background:rgba(30,24,35,.55)}
.th{width:36px;height:36px;border-radius:9px;object-fit:cover;flex:none;margin-left:2px}
.search{width:100%}
.hint{font-size:12px;color:var(--mute)}
.round.hit{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
input[type=number]{font-weight:800}
.prev b{font-weight:800;color:var(--acc)}
.meta .chk{font-size:13px}
.step{border-left:5px solid var(--acc2)}
.step .top b{flex:1}
.ins{display:flex;gap:4px;justify-content:center;margin:0 0 8px;opacity:.55}
.ins:hover,.ins:focus-within{opacity:1}
.ins button{font-size:12px;padding:2px 8px;border-style:dashed}
.sw{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);vertical-align:middle;margin-right:6px}
input[type=color]{padding:0;width:44px;height:36px;cursor:pointer}
textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;color:inherit;resize:vertical}
.prev.sp{font-family:Nunito,system-ui,sans-serif;font-size:15px;white-space:pre-wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.round{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.round .top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.lbl{width:64px;font-weight:700}
.it{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.it input[type=number]{width:64px}
.it .sk{font-size:13px;color:var(--mute);display:flex;gap:4px;align-items:center;white-space:nowrap}
.it.skip input[type=number],.it.skip select{opacity:.5}
.ld{display:contents}
.stn{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--line);color:var(--mute);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.rb{font-size:12px;font-weight:700;color:var(--acc);border:1px solid var(--acc);border-radius:10px;padding:0 6px;white-space:nowrap}
.it.inrep,.grp.inrep{border-left:3px solid var(--acc);padding-left:8px}
.reps{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.rp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rp input[type=number]{width:64px}
.grp{border-left:3px solid var(--acc2);padding-left:10px;margin:8px 0}
.grp small{color:var(--mute)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.meta label{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
.meta input.note{flex:1;min-width:160px}
.prev{margin-top:10px;padding:8px 10px;background:var(--bg);border-radius:8px;font-family:ui-monospace,Menlo,monospace;font-size:14px;word-break:break-word}
.trk{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.trk input{width:22px;height:22px;margin-top:2px;accent-color:var(--ok)}
.trk.done{opacity:.55}
.info{display:flex;gap:10px;align-items:flex-start;margin:0 0 8px 14px;padding:4px 10px;border-left:3px solid var(--acc2);color:var(--mute)}
.info .star{font-weight:800;color:var(--acc2);font-size:20px;line-height:1.1}
.info .prev{background:none;padding:0;flex:1;color:var(--mute);font-size:14px;line-height:1.4}
.info .prev b{color:var(--mute);font-weight:700}
.info .sw{width:12px;height:12px;border-width:1px;margin-right:4px}
.trk.done .prev{text-decoration:line-through}
.trk .prev{margin:0;flex:1}
.bar-lg{height:10px}
.warn{color:var(--acc2);font-size:13px}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}aside{border-right:none;border-bottom:1px solid var(--line);max-height:38vh}main{padding:0}.mh{padding:16px 16px 10px}.mb{padding:0 16px 16px}}
</style>
</head>
<body>
<div class="app">
<aside>
  <h1 style="display:flex;align-items:center;gap:10px"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23b58cf0%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23e0577d%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22url%28%23g%29%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2218%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.5%22/%3E%3Cpath%20d%3D%22M18%2026c10%206%2018%206%2028%200M16%2034c11%207%2021%207%2032%200M21%2043c8%204%2014%204%2022%200M27%2016c-4%2010-4%2021%202%2031M38%2015c4%209%204%2021-1%2032%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20opacity%3D%22.85%22/%3E%3Cpath%20d%3D%22M46%2046c5%203%207%207%2012%207%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E" alt="" width="32" height="32">Yarn Log</h1>
  <div class="tools">
    <button class="pri" data-act="newp">+ New project</button>
    <button data-act="export">Download</button>
    <button data-act="import">Upload</button>
  </div>
  <input type="file" id="imp" accept=".json,application/json" hidden>
  <input class="search" id="q" type="search" placeholder="Search title or stitch (dc, chain...)" aria-label="Search projects">
  <div id="warn" class="warn"></div>
  <div class="plist" id="plist"></div>
</aside>
<main id="main"></main>
</div>
<script>
const KEY='yarnlog.v1';
const T={ml:['Magic loop','ml'],ch:['Chain','ch'],sc:['Single stitch','sc'],hdc:['Half double','hdc'],dc:['Double stitch','dc'],tc:['Triple stitch','tc'],sl:['Slip stitch','sl st'],inc:['Increase','inc'],dec:['Decrease','dec']};
const S={q:'',projects:[],sel:null,view:'edit',open:{},confirm:null};
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Old format: one whole-row repeat (r.rep). New format: r.reps = [{from,to,n}] = repeat steps from..to (1-based) n times.
const migrate=p=>(p.rounds||[]).forEach(r=>{if(r.manual===undefined)r.manual=!!r.total;if(!r.step&&!Array.isArray(r.reps)){const n=Math.max(1,+r.rep||1);r.reps=n>1&&r.items&&r.items.length?[{from:1,to:r.items.length,n}]:[];delete r.rep}});
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(d))S.projects=d;S.projects.forEach(migrate)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S.projects));$('#warn').textContent=''}catch(e){$('#warn').textContent='Could not save: browser storage is full or blocked. Download a backup.'}}
const cur=()=>S.projects.find(p=>p.id===S.sel);
const fi=it=>it.group?'('+it.group.map(fi).join(', ')+')':`${it.n} ${T[it.t]?T[it.t][1]:it.t}`;
const cnt=it=>it.skip?0:it.group?it.group.reduce((s,c)=>s+cnt(c),0):it.t==='inc'?2*it.n:it.t==='dec'?-it.n:it.n;
const prevOf=r=>{for(const p of S.projects){const i=p.rounds.indexOf(r);if(i>=0){for(let j=i-1;j>=0;j--)if(!p.rounds[j].step)return p.rounds[j];return null}}return null};
const net=it=>it.skip?0:it.group?(it.group.every(c=>c.skip)?0:it.group.reduce((s,c)=>s+cnt(c),0)-1):(it.t==='inc'||it.t==='dec'||it.t==='ch'||it.t==='ml')?(it.t==='inc'?it.n:cnt(it)):0;
const rngs=r=>(r.reps||[]).map(g=>({a:Math.max(1,+g.from||1)-1,b:Math.min(r.items.length,+g.to||0)-1,n:Math.max(1,+g.n||1)})).filter(g=>g.b>=g.a);
const mult=(rs,i)=>rs.reduce((m,g)=>i>=g.a&&i<=g.b?m*g.n:m,1);
const crosses=rs=>rs.some((g,x)=>rs.some((h,y)=>x<y&&((g.a<h.a&&h.a<=g.b&&g.b<h.b)||(h.a<g.a&&g.a<=h.b&&h.b<g.b))));
const repWarn=r=>rngs(r).length<(r.reps||[]).length?'A repeat is ignored: check its step numbers.':crosses(rngs(r))?'Repeats can be nested, but not partly overlap.':'';
function fmtItems(items,rs,lo,hi,top){
  const out=[];let i=lo;
  while(i<=hi){
    const g=rs.filter(x=>x.a===i&&x.b<=hi).sort((x,y)=>y.b-x.b)[0];
    if(g){const inner=fmtItems(items,rs.filter(x=>x!==g),i,g.b,false);
      out.push(top&&g.a===0&&g.b===items.length-1?`${inner} | x${g.n}`:`( ${inner} ) | x${g.n}`);i=g.b+1}
    else{out.push(fi(items[i]));i++}
  }
  return out.join(', ');
}
const tot=r=>{const pv=prevOf(r),pt=pv?parseInt(totS(pv)):0,rs=rngs(r),own=r.items.reduce((s,it,i)=>s+cnt(it)*mult(rs,i),0);
  return Math.max(0,pt>0?pt+r.items.reduce((s,it,i)=>s+net(it)*mult(rs,i),0):own)};
const autoT=r=>tot(r)?tot(r)+'sc':'';
const totS=r=>r.manual?r.total:autoT(r);
const col=c=>/^#[0-9a-f]{3,8}$/i.test(c||'')?c:'#999999';
const stepText=r=>r.type==='color'?'Color change: '+(r.name||r.color):r.type==='hook'?'Hook change: '+(r.size||'?'):r.text||'';
const stepH=r=>r.type==='color'?`<span class="sw" style="background:${col(r.color)}"></span><b>Color change</b> ${esc(r.name||r.color)}`:r.type==='hook'?`<b>Hook change</b> to ${esc(r.size||'?').replace(/\d+/g,'<b>$&</b>')}`:esc(r.text||'(empty note)');
const bodyH=r=>r.step?stepH(r):frH(r);
const fr=r=>{if(r.step)return stepText(r);let s=r.label+' '+fmtItems(r.items,rngs(r),0,r.items.length-1,true);const t=totS(r);if(t)s+=` (${t})`;if(r.note)s+=`, ${r.note}`;return s.trim()};
const frH=r=>fr(r).split(/(\d+)/).map((x,i)=>i%2?`<b>${esc(x)}</b>`:esc(x)).join('');
const PH='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b58cf0"/><stop offset="1" stop-color="#e0577d"/></linearGradient></defs><rect width="64" height="64" fill="url(#g)"/><circle cx="32" cy="32" r="17" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M18 26c10 6 18 6 28 0M16 34c11 7 21 7 32 0M21 43c8 4 14 4 22 0M27 17c-4 10-4 20 2 30M38 16c4 9 4 20-1 31" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".85"/><path d="M46 46c5 3 7 7 12 7" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>');
const allIt=it=>it.group?it.group.flatMap(allIt):[it];
const roundHas=(r,q)=>!r.step&&r.items.flatMap(allIt).some(i=>T[i.t]&&(T[i.t][0]+' '+T[i.t][1]+' '+i.t).toLowerCase().includes(q));
const match=(p,q)=>!q||(p.title||'untitled').toLowerCase().includes(q)||p.rounds.some(r=>roundHas(r,q));
const prog=p=>{const rs=p.rounds.filter(r=>!r.step),n=rs.length,d=rs.filter(r=>p.build.done[r.id]).length;return{n,d,pct:n?Math.round(d/n*100):0}};

function renderList(){
  const q=S.q.trim().toLowerCase(),L=S.projects.filter(p=>match(p,q));
  $('#plist').innerHTML=L.length?L.map(p=>{
    const b=p.build,pr=b&&prog(p),open=S.open[p.id];
    return `<div class="prow ${p.id===S.sel?'sel':''}"><button class="chev ${b?'':'none'} ${open?'open':''}" data-act="toggle" data-id="${p.id}" aria-label="Show build">&#9660;</button><img class="th" src="${p.image||PH}" alt=""><button class="name" data-act="sel" data-id="${p.id}">${esc(p.title||'Untitled')}</button></div>`+
    (b&&open?`<div class="bld"><b>Building</b> &middot; ${pr.d}/${pr.n} rounds<div class="bar"><i style="width:${pr.pct}%"></i></div><div class="btns"><button class="pri" data-act="track" data-id="${p.id}">Continue</button><button data-act="complete" data-id="${p.id}">Complete</button></div></div>`:'');
  }).join(''):`<div style="color:var(--mute);font-size:14px">${q?'No project uses "'+esc(S.q)+'".':'No projects yet.'}</div>`;
}

function itemRow(it,a,lead,inrep){
  return `<div class="it ${it.skip?'skip':''} ${inrep?'inrep':''}" ${a}>${lead||''}<input type="number" min="1" value="${it.n}" data-f="n" aria-label="Amount"><select data-f="t" aria-label="Stitch type">${Object.entries(T).map(([k,v])=>`<option value="${k}" ${k===it.t?'selected':''}>${v[0]}</option>`).join('')}</select><label class="sk"><input type="checkbox" data-f="skip" ${it.skip?'checked':''}>Don't count</label><button class="ghost dng" data-act="${a.includes('data-c')?'delchild':'delitem'}" ${a} aria-label="Remove">&times;</button></div>`;
}
const STEPN={color:'Color change',hook:'Hook change',note:'Note'};
const insBar=at=>`<div class="ins"><button data-act="addstep" data-type="color" data-at="${at}">+ color</button><button data-act="addstep" data-type="hook" data-at="${at}">+ hook</button><button data-act="addstep" data-type="note" data-at="${at}">+ note</button></div>`;
function stepHTML(r,ri){
  const body=r.type==='color'?`<div class="row"><input type="color" value="${col(r.color)}" data-f="color" data-r="${ri}" aria-label="Color"><input style="flex:1" placeholder="Color name (optional)" value="${esc(r.name)}" data-f="name" data-r="${ri}"></div>`
   :r.type==='hook'?`<div class="row"><input placeholder="Hook size, e.g. 3.5 mm" value="${esc(r.size)}" data-f="size" data-r="${ri}" style="font-weight:800"></div>`
   :`<textarea rows="3" placeholder="Explain the next step in more detail..." data-f="text" data-r="${ri}">${esc(r.text)}</textarea>`;
  return `<div class="round step" data-r="${ri}"><div class="top"><b>${STEPN[r.type]}</b><button class="ghost" data-act="up" data-r="${ri}" aria-label="Move up">&uarr;</button><button class="ghost" data-act="dn" data-r="${ri}" aria-label="Move down">&darr;</button><button class="ghost dng" data-act="delround" data-r="${ri}">Delete</button></div>${body}</div>`;
}
// step number + repeat tags shown in front of each step
const leadH=(rs,ii)=>`<span class="stn" title="Step ${ii+1}">${ii+1}</span>`+rs.filter(g=>ii>=g.a&&ii<=g.b).map(g=>`<span class="rb" title="Inside a repeat of x${g.n}">&#8635;${g.n}</span>`).join('');
function refreshLeads(r,ri){const rs=rngs(r);r.items.forEach((_,ii)=>{const ld=document.querySelector(`[data-ld="${ri}-${ii}"]`);if(!ld)return;ld.innerHTML=leadH(rs,ii);const box=ld.closest('.it,.grp');if(box)box.classList.toggle('inrep',rs.some(g=>ii>=g.a&&ii<=g.b))})}
function roundHTML(r,ri){
  if(r.step)return stepHTML(r,ri);
  const rs=rngs(r),cov=ii=>rs.filter(g=>ii>=g.a&&ii<=g.b),lead=ii=>`<span class="ld" data-ld="${ri}-${ii}">${leadH(rs,ii)}</span>`;
  const items=r.items.map((it,ii)=>it.group?
    `<div class="grp ${cov(ii).length?'inrep':''}"><small>${lead(ii)} All of these go into one stitch:</small>${it.group.map((c,ci)=>itemRow(c,`data-r="${ri}" data-i="${ii}" data-c="${ci}"`)).join('')}<div class="row"><button data-act="addchild" data-r="${ri}" data-i="${ii}">+ Add to group</button><button class="dng" data-act="delitem" data-r="${ri}" data-i="${ii}">Remove group</button></div></div>`
    :itemRow(it,`data-r="${ri}" data-i="${ii}"`,lead(ii),cov(ii).length)).join('');
  const reps=`<div class="reps">${(r.reps||[]).map((g,k)=>{const d=`data-r="${ri}" data-k="${k}"`;return `<div class="rp"><span>Repeat steps</span><input type="number" min="1" max="${r.items.length}" value="${g.from}" data-f="rfrom" ${d} aria-label="Repeat from step"><span>to</span><input type="number" min="1" max="${r.items.length}" value="${g.to}" data-f="rto" ${d} aria-label="Repeat to step"><span>&times;</span><input type="number" min="1" value="${g.n}" data-f="rn" ${d} aria-label="Number of repeats"><button class="ghost dng" data-act="delrep" ${d} aria-label="Remove repeat">&times;</button></div>`}).join('')}<div class="row"><button data-act="addrep" data-r="${ri}">+ Repeat steps</button><span class="warn" data-rw="${ri}">${repWarn(r)}</span></div>${(r.reps||[]).length?'':'<div class="hint">Repeat a range of steps, e.g. steps 2 to 3 &times; 6.</div>'}</div>`;
  const hit=S.q.trim()&&roundHas(r,S.q.trim().toLowerCase());
  return `<div class="round ${hit?'hit':''}" data-r="${ri}"><div class="top"><input class="lbl" value="${esc(r.label)}" data-f="label" data-r="${ri}" aria-label="Round label"><span style="flex:1"></span><button class="ghost" data-act="up" data-r="${ri}" aria-label="Move up">&uarr;</button><button class="ghost" data-act="dn" data-r="${ri}" aria-label="Move down">&darr;</button><button class="ghost dng" data-act="delround" data-r="${ri}">Delete round</button></div>
  ${items}
  <div class="row"><button data-act="additem" data-r="${ri}">+ Stitch</button><button data-act="addgroup" data-r="${ri}">+ Group in one stitch</button></div>
  ${reps}
  <div class="meta"><label>Total<input style="width:90px;font-weight:800" value="${esc(r.manual?r.total:autoT(r))}" data-f="total" data-r="${ri}" data-tot="${ri}" ${r.manual?'':'disabled'}></label><label class="chk"><input type="checkbox" data-f="manual" data-r="${ri}" ${r.manual?'checked':''}>Override</label><input class="note" placeholder="Note, e.g. color change on last stitch (blue)" value="${esc(r.note)}" data-f="note" data-r="${ri}"></div>
  <div class="prev" data-prev="${ri}">${frH(r)}</div></div>`;
}

function renderMain(){const m=$('#main'),ob=m.querySelector('.mb'),k=S.sel+'|'+S.view,keep=ob&&m.dataset.k===k?ob.scrollTop:0;renderMain0();m.dataset.k=k;const nb=m.querySelector('.mb');if(nb)nb.scrollTop=keep}
function renderMain0(){
  const p=cur(),m=$('#main');
  if(!p){m.innerHTML='<div class="mb"><div class="empty"><h2>Pick a project or start a new one</h2><p>Write patterns round by round, then build them to tick off as you crochet.</p></div></div>';return}
  if(S.view==='track'&&p.build){
    const pr=prog(p);
    m.innerHTML=`<div class="mh"><div class="row" style="justify-content:space-between"><h2 class="serif" style="margin:0">${esc(p.title||'Untitled')}</h2><div class="row"><button data-act="edit">Edit pattern</button><button class="pri" data-act="complete" data-id="${p.id}">Complete project</button></div></div>
    <p>${pr.d} of ${pr.n} rounds done</p><div class="bar bar-lg"><i style="width:${pr.pct}%"></i></div></div><div class="mb">
    ${p.rounds.map((r,ri)=>r.step?`<div class="info"><span class="star">*</span><div class="prev sp">${stepH(r)}</div></div>`:`<label class="trk ${p.build.done[r.id]?'done':''}"><input type="checkbox" data-act="tick" data-r="${ri}" ${p.build.done[r.id]?'checked':''}><div class="prev">${frH(r)}</div></label>`).join('')||'<p>This pattern has no rounds yet.</p>'}
    <details style="color:var(--mute);margin-top:16px"><summary>Abbreviations</summary><p>${Object.values(T).map(v=>v[1]+' = '+v[0].toLowerCase()).join(', ')}</p></details></div>`;
    return;
  }
  m.innerHTML=`<div class="mh"><div class="head"><div class="img" data-act="img" title="Change photo"><img src="${p.image||PH}" alt=""><span>${p.image?'Change':'Add photo'}</span></div>
  <div style="flex:1;min-width:200px"><input class="title" value="${esc(p.title)}" placeholder="Project title" data-f="title">
  <div class="row" style="margin-top:10px"><button class="pri" data-act="${p.build?'track':'build'}" data-id="${p.id}">${p.build?'Continue building':'Build this pattern'}</button>${p.image?'<button data-act="delimg">Remove photo</button>':''}<button class="dng" data-act="delp" data-id="${p.id}">${S.confirm===p.id?'Click again to delete':'Delete project'}</button></div></div></div></div>
  <div class="mb"><input type="file" id="imgin" accept="image/*" hidden>
  <h2 class="serif pt">Pattern</h2>
  ${p.rounds.map((r,i)=>insBar(i)+roundHTML(r,i)).join('')+insBar(p.rounds.length)}
  <button class="pri" data-act="addround">+ Add round</button></div>`;
}
function render(){renderList();renderMain()}

function getIt(el){const p=cur(),r=p.rounds[+el.dataset.r];let it=r.items[+el.dataset.i];if(el.dataset.c!==undefined)it=it.group[+el.dataset.c];return it}
$('#q').addEventListener('input',e=>{S.q=e.target.value;renderList();if(cur()&&S.view==='edit')renderMain()});
document.addEventListener('input',e=>{
  const el=e.target,f=el.dataset.f,p=cur();if(!f||!p)return;
  if(f==='title'){p.title=el.value;renderList();save();return}
  const row=el.closest('.it'),ri=+(row||el).dataset.r,rr=p.rounds[ri];
  if(f==='manual'){rr.manual=el.checked;if(rr.manual&&!rr.total)rr.total=autoT(rr);save();renderMain();return}
  const RK={rfrom:'from',rto:'to',rn:'n'};
  if(RK[f])rr.reps[+el.dataset.k][RK[f]]=Math.max(1,+el.value||1);
  else if(row){const it=getIt(row);if(f==='n')it.n=Math.max(1,+el.value||1);else if(f==='skip')it.skip=el.checked;else it.t=el.value}
  else rr[f]=el.value;
  if(RK[f])refreshLeads(rr,ri);
  p.rounds.forEach((r,i)=>{const pv=document.querySelector(`[data-prev="${i}"]`);if(pv)pv.innerHTML=frH(r);
    const rw=document.querySelector(`[data-rw="${i}"]`);if(rw)rw.textContent=repWarn(r);
    const tf=document.querySelector(`[data-tot="${i}"]`);if(tf&&!r.manual)tf.value=autoT(r)});
  if(f==='t'&&S.q.trim())renderMain();
  save();
});
document.addEventListener('change',e=>{
  const el=e.target;if(el.id==='imgin'&&el.files[0])return setImg(el.files[0]);
  if(el.id==='imp'&&el.files[0])return importFile(el.files[0]);
  if(el.dataset.act==='tick'){const p=cur(),r=p.rounds[+el.dataset.r];p.build.done[r.id]=el.checked;save();render()}
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT')return;
  const a=el.dataset.act,p=cur(),id=el.dataset.id,r=el.dataset.r;
  if(a==='newp'){const n={id:uid(),title:'',image:'',rounds:[],build:null};S.projects.unshift(n);S.sel=n.id;S.view='edit';save();render();document.querySelector('.title')?.focus();return}
  if(a==='sel'){S.sel=id;S.view='edit';S.confirm=null;render();return}
  if(a==='toggle'){S.open[id]=!S.open[id];renderList();return}
  if(a==='track'){S.sel=id;S.view='track';render();return}
  if(a==='edit'){S.view='edit';render();return}
  if(a==='complete'){const q=S.projects.find(x=>x.id===id);q.build=null;if(S.sel===id)S.view='edit';save();render();return}
  if(a==='export'){const b=new Blob([JSON.stringify({app:'yarnlog',version:1,projects:S.projects},null,1)],{type:'application/json'});const u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='crochet-projects.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);return}
  if(a==='import'){$('#imp').click();return}
  if(!p)return;
  if(a==='delp'){if(S.confirm!==id){S.confirm=id;renderMain();return}S.projects=S.projects.filter(x=>x.id!==id);S.sel=null;S.confirm=null}
  else if(a==='build'){p.build={done:{},started:Date.now()};S.open[p.id]=true;S.view='track'}
  else if(a==='img'){$('#imgin').click();return}
  else if(a==='delimg')p.image='';
  else if(a==='addstep')p.rounds.splice(+el.dataset.at,0,{id:uid(),step:1,type:el.dataset.type,color:'#e0577d',name:'',size:'',text:''});
  else if(a==='addround')p.rounds.push({id:uid(),label:'R'+(p.rounds.filter(x=>!x.step).length+1),items:[{n:1,t:'sc'}],reps:[],total:'',manual:false,note:''});
  else if(a==='delround')p.rounds.splice(+r,1);
  else if(a==='up'&&+r>0)p.rounds.splice(+r-1,0,p.rounds.splice(+r,1)[0]);
  else if(a==='dn'&&+r<p.rounds.length-1)p.rounds.splice(+r+1,0,p.rounds.splice(+r,1)[0]);
  else if(a==='additem')p.rounds[+r].items.push({n:1,t:'sc'});
  else if(a==='addgroup')p.rounds[+r].items.push({group:[{n:1,t:'dc'}]});
  else if(a==='addchild')p.rounds[+r].items[+el.dataset.i].group.push({n:1,t:'sc'});
  else if(a==='addrep'){const rd=p.rounds[+r];rd.reps.push({from:1,to:rd.items.length||1,n:2})}
  else if(a==='delrep')p.rounds[+r].reps.splice(+el.dataset.k,1);
  else if(a==='delitem'){const rd=p.rounds[+r];rd.items.splice(+el.dataset.i,1);dropStep(rd,+el.dataset.i)}
  else if(a==='delchild'){const rd=p.rounds[+r],g=rd.items[+el.dataset.i].group;g.splice(+el.dataset.c,1);if(!g.length){rd.items.splice(+el.dataset.i,1);dropStep(rd,+el.dataset.i)}}
  else return;
  save();render();
});
// keep repeat ranges pointing at the same steps after a step is removed
function dropStep(rd,i){const pos=i+1;rd.reps=(rd.reps||[]).map(g=>pos<g.from?{...g,from:g.from-1,to:g.to-1}:pos<=g.to?{...g,to:g.to-1}:g).filter(g=>g.to>=g.from)}
function setImg(file){
  const fr_=new FileReader();
  fr_.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    cur().image=c.toDataURL('image/jpeg',.8);save();render()};im.src=fr_.result};
  fr_.readAsDataURL(file);
}
function importFile(file){
  const rd=new FileReader();
  rd.onload=()=>{try{
    const d=JSON.parse(rd.result),list=Array.isArray(d)?d:d.projects;
    if(!Array.isArray(list))throw 0;
    list.forEach(n=>{if(!n.id||!Array.isArray(n.rounds))return;migrate(n);const i=S.projects.findIndex(x=>x.id===n.id);i>=0?S.projects[i]=n:S.projects.push(n)});
    save();render();$('#warn').textContent='';
  }catch(e){$('#warn').textContent='That file is not a valid Yarn Log backup.'}$('#imp').value=''};
  rd.readAsText(file);
}
load();render();
</script>
</body>
</html>
